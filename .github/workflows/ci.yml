name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TEST_THREADS: 1

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Windows assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value "$env:ProgramFiles\NASM"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-wasip2
      - name: Select Rust
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native server
        run: cargo build -p translation-lsp --release --locked
      - name: Build WASM extension
        run: cargo build -p translation-lsp-extension --target wasm32-wasip2 --release --locked

  distribution:
    name: Distribution contracts and registry compiler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check release metadata
        run: cargo +stable run -p xtask --locked -- check-source
      - name: Install registry compiler
        run: rustup toolchain install 1.90.0 --profile minimal --target wasm32-wasip2
      - name: Build with registry compiler
        run: cargo +1.90.0 build -p translation-lsp-extension --target wasm32-wasip2 --release --locked
      - name: Install cargo-about
        run: cargo +stable install --locked --features cli cargo-about@0.9.2
      - name: Check native dependency notices
        run: cargo +stable run -p xtask --locked -- check-notices

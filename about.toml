# Licenses accepted for the dependencies of the native server, read by
# cargo-about. Where a dependency offers a choice, the first one listed here is
# used. A dependency under no license listed here stops the generation.
accepted = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
]

# The server's own license is a separate file of the archive.
private = { ignore = true }
ignore-dev-dependencies = true

# chrono keeps both of its license texts in one file.
workarounds = ["chrono"]

# The entries below name the license files of crates in which cargo-about finds
# none by itself, so that the notices carry the text and the copyright notice
# of the crate's authors. cargo-about uses a file only if its SHA-256 checksum
# matches. `license` repeats the license the crate declares, and replaces it
# in the notices. `xtask` fails when the two differ, except for the crates that
# `DECLARED` in `xtask/src/notices.rs` lists.

# These crates name their license files in lowercase, which cargo-about does
# not read.
[windows-core.clarify]
license = "MIT OR Apache-2.0"
files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }]

[windows-implement.clarify]
license = "MIT OR Apache-2.0"
files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }]


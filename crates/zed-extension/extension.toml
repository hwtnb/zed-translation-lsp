id = "translation-lsp"
name = "Translation LSP"
version = "0.4.0"
schema_version = 1
description = "Translate code comments and selected text with ChatGPT, the OpenAI, Anthropic, or DeepL API, Google Cloud Translation, or an OpenAI-compatible service while keeping the original source unchanged."
authors = ["hwtnb"]
repository = "https://github.com/hwtnb/zed-translation-lsp"

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["hwtnb", "zed-translation-lsp", "releases", "download", "**"]

[language_servers.translation-lsp]
name = "Translation LSP"
languages = ["Rust", "JavaScript", "TypeScript", "TSX", "CSharp", "C", "C++", "Python", "Go", "Java", "Kotlin", "Swift", "Ruby", "PHP", "HTML", "XML", "CSS", "SQL", "Lua", "Zig", "Proto", "GraphQL", "JSON", "JSONC", "YAML", "TOML", "Shell Script", "PowerShell", "Dockerfile", "Docker Compose", "Make", "Markdown", "Plain Text"]


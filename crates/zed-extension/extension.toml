id = "translation-lsp"
name = "Translation LSP"
version = "0.1.0"
schema_version = 1
description = "Translate code comments and selected text with ChatGPT or the Anthropic API while keeping the original source unchanged."
authors = ["hwtnb"]
repository = "https://github.com/hwtnb/zed-translation-lsp"

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["hwtnb", "zed-translation-lsp", "releases", "download", "**"]

[language_servers.translation-lsp]
name = "Translation LSP"
languages = ["Rust", "JavaScript", "TypeScript", "TSX", "CSharp", "C", "C++", "Python", "JSON", "JSONC", "YAML", "TOML", "Shell Script", "PowerShell", "Dockerfile", "Docker Compose", "Markdown", "Plain Text"]

[language_servers.translation-lsp.language_ids]
Rust = "rust"
JavaScript = "javascript"
TypeScript = "typescript"
TSX = "typescriptreact"
CSharp = "csharp"
C = "c"
"C++" = "cpp"
Python = "python"
JSON = "json"
JSONC = "jsonc"
YAML = "yaml"
TOML = "toml"
"Shell Script" = "shellscript"
PowerShell = "powershell"
Dockerfile = "dockerfile"
"Docker Compose" = "dockercompose"
Markdown = "markdown"
"Plain Text" = "plaintext"

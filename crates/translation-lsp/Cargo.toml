[package]
name = "zed-code-translation-lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
crossbeam-channel = "0.5"
dirs = "7.0"
eventsource-stream = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1.11", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
lsp-server = "0.10"
lsp-types = "0.97"
openidconnect = { version = "4.0", default-features = false, features = ["timing-resistant-secret-traits"] }
oxc_allocator = "0.152"
oxc_parser = "0.152"
oxc_span = "0.152"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rust_lexer = { package = "ra-ap-rustc_lexer", version = "0.175" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt", "sync", "time", "net", "macros"] }
uuid = { version = "1.27", features = ["v4", "serde"] }

[dev-dependencies]
ed25519-dalek = { version = "2.2", features = ["rand_core", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }

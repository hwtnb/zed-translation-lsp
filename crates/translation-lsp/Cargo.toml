[package]
name = "translation-lsp"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/hwtnb/zed-translation-lsp"
publish = false

[lints]
workspace = true

[dependencies]
crossbeam-channel = "0.5"
dirs = "7.0"
eventsource-stream = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
granit-parser = { version = "2.0", default-features = false, features = ["comments"] }
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1.12", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
icu_segmenter = "2.4"
isolang = "2.4"
lsp-server = "0.10"
lsp-types = "0.97"
openidconnect = { version = "4.0", default-features = false, features = ["timing-resistant-secret-traits"] }
oxc_allocator = "0.156"
oxc_parser = "0.156"
oxc_span = "0.156"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rpassword = "7.5"
rust_lexer = { package = "ra-ap-rustc_lexer", version = "0.179" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "sync", "time", "net", "macros", "signal"] }
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-python = "0.25"
# Match the Unicode 17 tables required by ra-ap-rustc_lexer 0.179.
unicode-ident = "=1.0.24"
uuid = { version = "1.29", features = ["v4", "serde"] }

[dev-dependencies]
ed25519-dalek = { version = "3.0", features = ["rand_core", "pem"] }
getrandom = { version = "0.4", features = ["sys_rng"] }

# The pseudo-terminal that the key command is tested on.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
